# ============================================================
# capdtm.conf - 拍摄参数映射表
# 格式: 参数名|显示名|取值列表(名称=hex,以逗号分隔)
#   - 名称: st cap capdtm getusr 输出的第 3 列(如 ISO_AUTO)
#   - hex : st cap capdtm setusr 写入用的值(与固件版本相关)
# 参数 ID 在不同固件版本(NX1 1.11 / NX500 1.12/1.40)有偏移,
# 如写入无效请在相机上用 `st cap capdtm getusr 参数名` 核对,
# 再把对应的 hex 填到本表(或留空名称项,脚本会尝试直接按名称写入)。
#
# 说明: 下表取值名称依据 NX500 固件 capdtm 输出整理,
#       hex 部分留空表示"按名称写入",需实机验证。
# ============================================================

USERDATA_ISO|ISO|ISO_AUTO=,ISO_100=,ISO_200=,ISO_400=,ISO_800=,ISO_1600=,ISO_3200=,ISO_6400=,ISO_12800=,ISO_25600=
USERDATA_METERING|测光|METERING_MULTI=,METERING_CENTER=,METERING_SPOT=
USERDATA_WB|白平衡|WB_AUTO=,WB_DAYLIGHT=,WB_CLOUDY=,WB_TUNGSTEN=,WB_FLUORESCENT=,WB_FLASH=,WB_CUSTOM=
USERDATA_IMAGEQUALITY|图像质量|IMAGEQUALITY_RAW=,IMAGEQUALITY_RAW_JPG=,IMAGEQUALITY_SUPERFINE=,IMAGEQUALITY_FINE=,IMAGEQUALITY_NORMAL=
USERDATA_IMAGESIZE|图像尺寸|IMAGESIZE_NORMAL_28M=,IMAGESIZE_NORMAL_20M=,IMAGESIZE_NORMAL_14M=,IMAGESIZE_NORMAL_10M=,IMAGESIZE_NORMAL_5_9M=,IMAGESIZE_NORMAL_2M=
USERDATA_IMAGEASPECTRATIO|纵横比|IMAGEASPECTRATIO_IMAGEAR_3_2=,IMAGEASPECTRATIO_IMAGEAR_16_9=,IMAGEASPECTRATIO_IMAGEAR_1_1=,IMAGEASPECTRATIO_IMAGEAR_4_3=
USERDATA_PW|照片风格|PW_STANDARD=,PW_VIVID=,PW_PORTRAIT=,PW_LANDSCAPE=,PW_FOREST=,PW_RETRO=,PW_COOL=,PW_CALM=,PW_CLASSIC=,PW_CUSTOM1=,PW_CUSTOM2=,PW_CUSTOM3=,PW_CUSTOM4=
USERDATA_COLORSPACE|色彩空间|COLORSPACE_SRGB=,COLORSPACE_ADOBERGB=
USERDATA_AFMODE|对焦模式|AFMODE_SINGLE=,AFMODE_CONTINUOUS=,AFMODE_MF=
USERDATA_DRIVE|驱动模式|DRIVE_SINGLE=,DRIVE_CONTI_N=,DRIVE_CONTI_H=,DRIVE_TIMER=,DRIVE_BRACKET=
